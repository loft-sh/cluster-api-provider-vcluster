name: Push head images

# The daily CVE scan reads ghcr.io/loft-sh/cluster-api-provider-vcluster:head, so it follows main.
on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - "vendor/**"
      - "main.go"
      - "api/**"
      - "controllers/**"
      - "pkg/**"
      - ".github/workflows/push-head-images.yaml"
  workflow_dispatch:

concurrency:
  group: push-head-images
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: github.repository_owner == 'loft-sh'

    name: Publish cluster-api-provider-vcluster head image

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write       # Required to push to GHCR
      id-token: write       # Required for Cosign keyless OIDC signing and provenance
      attestations: write   # Required to publish build provenance attestation

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Go as the release workflow, so the scan sees what a release would ship.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The Dockerfile copies a prebuilt binary, built as `make docker-build` does.
      # The scan reads linux/amd64 only.
      - name: Build binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o release/manager main.go

      - name: Setup Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: "v3.0.6"

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record the current head image
        id: previous-head
        uses: loft-sh/github-actions/.github/actions/delete-previous-head-image@delete-previous-head-image/v1 # zizmor: ignore[unpinned-uses] -- internal loft-sh action, pinned by its own rolling tag by policy
        with:
          mode: record
          image: ghcr.io/${{ github.repository_owner }}/cluster-api-provider-vcluster

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push head image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build-push-docker
        with:
          platforms: linux/amd64
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cluster-api-provider-vcluster:head

      - name: Sign head image
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/cluster-api-provider-vcluster:head
          IMAGE_DIGEST: ${{ steps.build-push-docker.outputs.digest }}
        run: cosign sign --yes "${IMAGE_TAG}@${IMAGE_DIGEST}"

      - name: Attest head image build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cluster-api-provider-vcluster
          subject-digest: ${{ steps.build-push-docker.outputs.digest }}
          push-to-registry: true

      # Last step, so a failed build or push never deletes the image it replaces.
      - name: Delete the previous head image
        uses: loft-sh/github-actions/.github/actions/delete-previous-head-image@delete-previous-head-image/v1 # zizmor: ignore[unpinned-uses] -- internal loft-sh action, pinned by its own rolling tag by policy
        with:
          mode: delete
          image: ghcr.io/${{ github.repository_owner }}/cluster-api-provider-vcluster
          previous-digest: ${{ steps.previous-head.outputs.digest }}
          current-digest: ${{ steps.build-push-docker.outputs.digest }}
